[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sunshutter"
version = "0.1.0"
description = "Sun-position-driven window shutter control (Netanya, Israel). Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sunshutter = "sunshutter.cli:main"

[tool.setuptools]
packages = ["sunshutter"]
